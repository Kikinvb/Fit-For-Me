<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d3d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fit For Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="app">
      <header class="hero">
        
        <h1 class="brand">Fit <em>For</em> Me</h1>
        <p class="hero-lead">每周 3 练 · A/B 交替 · 建立动作感觉</p>
        <div class="chip-row" id="focusChips"></div>
      </header>

      <div id="patternToggle"></div>
      <div class="week" id="week" aria-label="一周安排"></div>

      <main id="mainView">
        <div id="sessionView"></div>
        <div id="progressView" class="hidden"></div>
        <div id="statsView" class="hidden"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <button type="button" class="nav-btn active" data-tab="today">今天</button>
      <button type="button" class="nav-btn" data-tab="progress">进阶</button>
      <button type="button" class="nav-btn" data-tab="stats">统计</button>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
